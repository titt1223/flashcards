<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flashcards</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4b8a63">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
:root{--bg:#eef4ef;--card:#fbfdfb;--fg:#1e2e25;--mut:#65796d;--pri:#4b8a63;--pri2:#33694a;--soft:#dcebe0;--soft2:#c8dfcf;--ok:#4f9a6a;--ko:#c4735f;--bd:#d5e2d8;--onpri:#fff;--sh:0 2px 4px rgba(40,80,55,.05),0 8px 24px rgba(40,80,55,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1712;--card:#16221a;--fg:#e4efe7;--mut:#8fa898;--bd:#25372b;--pri:#7cc596;--pri2:#9ad6b0;--soft:#1e3125;--soft2:#294133;--ok:#6bbd86;--ko:#d48c78;--onpri:#0e1712;--sh:0 2px 4px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--fg);font:16px/1.55 Nunito,system-ui,Segoe UI,Roboto,sans-serif;background:radial-gradient(900px 300px at 50% -80px,var(--soft2),transparent) no-repeat,var(--bg);min-height:100vh}
#app{max-width:780px;margin:0 auto;padding:18px 16px calc(100px + env(safe-area-inset-bottom))}
h1{font-size:1.7rem;font-weight:800;margin:0 0 10px;color:var(--pri2);letter-spacing:-.02em;line-height:1.2}
.hero{display:flex;align-items:center;gap:14px;margin:6px 0 16px}
.hero h1{margin:0}
.logo{width:48px;height:48px;border-radius:15px;overflow:hidden;box-shadow:var(--sh);flex:none}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}.sp{flex:1}.grow{flex:1;min-width:0}
.bar button{white-space:nowrap}.bar>.grow{min-width:130px}
.topbar{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.ttl{font-size:1.05rem;font-weight:800;color:var(--pri2);margin-left:4px}
button,.btn{font:inherit;font-weight:700;font-size:.95rem;border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:9px 16px;min-height:42px;border-radius:12px;cursor:pointer;transition:transform .12s,background .15s,border-color .15s,box-shadow .15s}
button:hover:not(:disabled){background:var(--soft);border-color:var(--pri)}
button:active:not(:disabled){transform:scale(.97)}
.pri{background:var(--pri);border-color:var(--pri);color:var(--onpri)}.pri:hover:not(:disabled){background:var(--pri2);border-color:var(--pri2);color:var(--onpri)}
.ok{background:var(--ok);border-color:var(--ok);color:var(--onpri)}.ko{background:var(--ko);border-color:var(--ko);color:var(--onpri)}
.ok:hover:not(:disabled),.ko:hover:not(:disabled){filter:brightness(.92);color:var(--onpri)}
.danger{color:var(--ko)}button:disabled{opacity:.4;cursor:default}
.ib{min-width:42px;padding:0 10px;display:inline-grid;place-items:center;font-size:1.1rem;line-height:1;border-color:transparent;background:transparent}
.ib:hover:not(:disabled){background:var(--soft);border-color:transparent}
.ib.bd{border-color:var(--bd);background:var(--card)}
.sm{min-height:36px;padding:5px 14px;font-size:.9rem}
.lnk{border:0;background:none;color:var(--pri2);text-decoration:underline;min-height:auto;padding:4px 6px;font-size:.9rem}
.lnk:hover:not(:disabled){background:none}.lnk[hidden]{display:none}
.box{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.deck{cursor:pointer;position:relative;padding-left:24px;transition:transform .15s,border-color .15s}
.deck::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:6px;border-radius:0 6px 6px 0;background:linear-gradient(var(--pri),var(--ok))}
.deck:hover{transform:translateY(-2px);border-color:var(--pri)}
.deck b{font-size:1.1rem;font-weight:800}
.mut{color:var(--mut);font-size:.9rem}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.chip{font-size:.78rem;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--mut)}
.chip.g{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}.chip.r{background:color-mix(in srgb,var(--ko) 20%,transparent);color:var(--ko)}
.chip.f{background:color-mix(in srgb,var(--ko) 14%,transparent);color:var(--ko)}
.prog{display:flex;height:9px;border-radius:9px;overflow:hidden;background:var(--soft);margin-top:10px}
.prog i{display:block;transition:width .4s}.g{background:var(--ok)}.r{background:var(--ko)}
input[type=text],input[type=password],input[type=search],textarea,select{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);color:var(--fg)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--soft)}
input[type=checkbox]{accent-color:var(--pri);width:18px;height:18px}
input[type=search]{-webkit-appearance:none;appearance:none}
textarea{min-height:90px;resize:vertical}
label{display:block;margin:12px 0 5px;font-weight:700;font-size:.9rem}
.row{display:flex;gap:12px}.row>*{flex:1}
.tabs{background:var(--soft);padding:4px;border-radius:14px;gap:4px;display:flex;flex-wrap:wrap}.tabs button{border:0;background:transparent;flex:1;min-height:38px;padding:6px 10px}
.tabs button.on,.tabs button.pri{background:var(--card);color:var(--pri2);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.search{margin:0 0 14px}
.toolrow{display:flex;gap:8px;margin:16px 0 12px;align-items:center}
.toolrow .search{flex:1;min-width:0;margin:0}
.toolrow select{width:auto;flex:none;max-width:40%;min-width:104px}
.crow{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;margin-bottom:8px;cursor:pointer;overflow-wrap:anywhere;white-space:pre-wrap;transition:border-color .15s,background .15s}
.crow:hover{border-color:var(--pri)}.crow.on{border-color:var(--pri);background:var(--soft)}
.crow .ans-line{color:var(--mut);margin-top:2px}
.chk{font-size:1.25rem;line-height:1.25;flex:none}
.flg{flex:none}
.selbar{position:sticky;top:8px;z-index:5;display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--pri);border-radius:14px;padding:6px 8px;margin-bottom:10px;box-shadow:var(--sh)}
.fc{min-height:280px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.4rem;font-weight:600;padding:32px 22px;cursor:pointer;white-space:pre-wrap;user-select:none;overflow-wrap:anywhere;position:relative;animation:flipin .35s ease;background:linear-gradient(160deg,var(--card),var(--soft))}
@keyframes flipin{from{transform:perspective(700px) rotateX(-55deg);opacity:.2}to{transform:none;opacity:1}}
.fc-in{max-width:100%;text-align:center}
.fc .lab{position:absolute;top:14px;left:18px;font-size:.72rem;font-weight:800;color:var(--pri);letter-spacing:.1em;text-transform:uppercase}
.ans{display:flex;gap:12px;margin-top:14px}.ans button{flex:1;padding:16px;font-size:1.05rem;border-radius:16px}
.dot{width:12px;height:12px;border-radius:50%;margin-top:7px;flex:none;background:var(--bd)}
.dot.known{background:var(--ok)}.dot.unknown{background:var(--ko)}
.pv{white-space:pre-wrap;font:inherit;font-size:.88rem;background:var(--soft);padding:10px;border-radius:12px;margin:8px 0 0}
.banner{background:var(--soft);border:1px solid var(--soft2);border-radius:16px;padding:12px 16px;margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
details summary{cursor:pointer}code{background:var(--soft);padding:1px 6px;border-radius:6px;font-size:.85em}
mark{background:color-mix(in srgb,#f2d64b 60%,transparent);color:inherit;padding:0 .12em;border-radius:4px}
.empty{text-align:center;padding:40px 10px}.empty .big{font-size:3rem}
.folder{border:1.5px dashed var(--soft2);background:linear-gradient(160deg,var(--card),var(--soft))}
.fhead{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.fold-ico{color:var(--mut);font-size:1.1rem;padding:0 4px}
.ltb{display:flex;gap:4px;align-items:center;margin:2px 0 6px}
.ltb .ib{border:1px solid var(--bd);background:var(--card)}
.hlgrp{display:inline-flex;gap:2px;align-items:center}
#hlcolor{width:34px;height:34px;padding:2px;border-radius:10px;border:1.5px solid var(--bd);background:var(--card);cursor:pointer}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(22px,calc(env(safe-area-inset-bottom) + 12px));width:58px;height:58px;min-height:0;border-radius:50%;background:var(--pri);color:var(--onpri);border:0;font-size:2rem;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.28);padding:0;display:grid;place-items:center;z-index:20}
.fab:hover:not(:disabled){background:var(--pri2)}
#sheet .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;animation:fade .15s}
#sheet .sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;padding:10px 14px calc(18px + env(safe-area-inset-bottom));z-index:51;max-height:82vh;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.3);animation:up .2s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.grab{width:42px;height:4px;border-radius:4px;background:var(--bd);margin:2px auto 10px}
.sheet h3{margin:4px 6px 8px;font-size:1rem;color:var(--pri2)}
.srow{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;text-align:left;border:0;background:none;border-radius:12px;padding:12px 10px;min-height:48px;font-weight:700;font-size:1rem;color:var(--fg);margin:0}
.srow small{color:var(--mut);font-weight:800;background:var(--soft);padding:1px 10px;border-radius:99px;font-size:.82rem}
.srow:hover:not(:disabled){background:var(--soft);border:0}
.srow.danger{color:var(--ko)}
.srow.static{cursor:default;font-weight:600}.srow.static:hover{background:none}
.srow.static select{width:auto;max-width:55%}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sgrid button{min-height:52px;font-size:1.1rem}
.katex-display{overflow-x:auto;overflow-y:hidden}
@media(max-width:520px){.row{flex-direction:column;gap:0}.ans{flex-direction:column-reverse}.toolrow select{max-width:38%}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script defer src="app.js"></script>
</body>
</html>
